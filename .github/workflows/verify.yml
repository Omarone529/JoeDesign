# Controlli automatici a ogni push e a ogni pull request su main.
#
# Perché esiste. `npm test` e `npm run lint` erano comandi da lanciare a mano,
# e nessuno li lanciava al momento giusto: il deploy su Netlify parte dal push,
# non dal terminale di chi ha scritto il codice. Una rotta rotta in `routes.js`
# — che è il file da cui dipendono tutte e 66 le pagine — sarebbe uscita in
# produzione senza che niente si fermasse.
#
# Quello che gira qui è la stessa cosa che gira in locale, con gli stessi
# comandi: se passa qui passa sul portatile, e viceversa. La versione di Node
# sta in `.nvmrc` ed è la stessa di `netlify.toml` e di `engines`, o si
# controllerebbe una versione diversa da quella che poi costruisce il sito.
#
# `npm run hydration` gira in un job a parte, dopo che i controlli sono verdi.
name: Verifica

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `ci` e non `install`: installa esattamente le versioni del lockfile,
      # che sono quelle con cui il sito è stato costruito e provato.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # I dati contro i file su disco. Gira anche da solo dentro `prebuild`,
      # ma tenerlo separato serve a leggere quale dei due si è rotto senza
      # aprire il log della build.
      - name: Verifica dati e immagini
        run: npm run verify

      # L'ultimo perché è il più lento, e perché è quello che ripete tutto:
      # se i tre passi sopra sono verdi, qui si controlla solo che le 66 pagine
      # si scrivano davvero.
      - name: Build e pre-rendering
        run: npm run build

  # L'aggancio di React sulle 66 pagine, col Chrome già presente sull'immagine ubuntu.
  # Prima l'autotest: se non vede il guasto simulato, il verde dopo non vale niente.
  hydration:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Autotest del rilevatore
        run: npm run hydration -- --break

      - name: Hydration
        run: npm run hydration
