[build]
  command = "npm run build"
  publish = "dist"

# Node viene da `.nvmrc`: ripeterlo qui farebbe due numeri da tenere allineati.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Senza `preload`: è una scelta che non si ritira.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # ⚠️ Una risorsa esterna nuova va aggiunta qui, o il browser la blocca in silenzio.
    # 'unsafe-inline' negli stili serve agli attributi `style=` di React.
    # Per diagnosticare: rinominare in Content-Security-Policy-Report-Only.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# Nomi con l'hash del contenuto: in cache per sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le immagini tengono il nome anche quando cambiano: cache a termine.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# 404 vera, non un 200 sulla home. Prima quella inglese.
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
